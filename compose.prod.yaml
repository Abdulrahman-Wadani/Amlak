# Production on the server. Caddy is the only service with open ports; it
# serves the web app and the API on https://DOMAIN.
#   docker compose -f compose.prod.yaml up -d --build
name: amlak-prod

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: amlak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: amlak
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amlak -d amlak"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://amlak:${POSTGRES_PASSWORD}@db:5432/amlak
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Amlak <onboarding@resend.dev>}
      APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      # No S3 keys: on EC2 the AWS library uses the server's IAM role.
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The certificates; keeping them avoids asking Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config: