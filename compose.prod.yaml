# Production on the server. Caddy is the only service with open ports; it
# serves the web app and the API on https://DOMAIN.
#   docker compose -f compose.prod.yaml up -d --build
name: amlak-prod

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: amlak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: amlak
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amlak -d amlak"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Metrics for Alloy only: this port is not published.
      METRICS_PORT: 9464
      LOG_LEVEL: info
      DATABASE_URL: postgresql://amlak:${POSTGRES_PASSWORD}@db:5432/amlak
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Amlak <onboarding@resend.dev>}
      APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      # No S3 keys: on EC2 the AWS library uses the server's IAM role.
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        VITE_TOMTOM_API_KEY: ${VITE_TOMTOM_API_KEY:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The certificates; keeping them avoids asking Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  # Collects metrics and logs and sends them to Grafana Cloud. No ports.
  alloy:
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:?Set GRAFANA_CLOUD_PROM_URL in .env}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:?Set GRAFANA_CLOUD_PROM_USER in .env}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?Set GRAFANA_CLOUD_LOKI_URL in .env}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:?Set GRAFANA_CLOUD_LOKI_USER in .env}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:?Set GRAFANA_CLOUD_TOKEN in .env}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:?Set POSTGRES_MONITOR_PASSWORD in .env}
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read-only host views for the server's CPU, memory and disk.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Read-only, to find the containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 300m
    depends_on:
      - api
      - db

volumes:
  db-data:
  caddy-data:
  caddy-config:
  alloy-data: