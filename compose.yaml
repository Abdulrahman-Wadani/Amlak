services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: amlak
      POSTGRES_PASSWORD: amlak
      POSTGRES_DB: amlak
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amlak -d amlak"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
