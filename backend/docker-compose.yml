
services:
  app:
    build: .
    container_name: amlak-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://amlak_user:amlak_password@db:5432/amlak?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: amlak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: amlak
      POSTGRES_USER: amlak_user
      POSTGRES_PASSWORD: amlak_password
    volumes:
      - amlak_data:/var/lib/postgresql/data
      - ./amlak.sql:/docker-entrypoint-initdb.d/01-amlak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amlak_user -d amlak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amlak_data:
